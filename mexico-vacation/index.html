<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Monterrey New Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
/* Sign-in shell for a locked page. The trip page itself is in page.enc.json and replaces this once unlocked. */
:root{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#1D2129;--muted:#626872;--line:#DCDAD3;--accent:#B3125A;
  --f-display:"Fraunces",Georgia,serif;--f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#14161A;--surface:#1C1F25;--ink:#ECEAE4;--muted:#A2A7AF;--line:#2E323A;--accent:#F0679F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:640px;margin:0 auto;padding:clamp(28px,7vw,72px) 20px 64px}
.back{color:var(--muted);font-size:14px;text-decoration:none}
.back:hover{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,60px);line-height:1.02;margin:16px 0 0;letter-spacing:-.01em}
.when{color:var(--muted);margin:10px 0 0;font-variant-numeric:tabular-nums}
p.say{color:var(--muted);margin:24px 0 16px;max-width:44ch}
[data-show]{display:none}
body[data-auth="loading"] [data-show="loading"],body[data-auth="out"] [data-show="out"],
body[data-auth="in"] [data-show="in"],body[data-auth="denied"] [data-show="denied"]{display:block}
.btn{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#14161A}}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<link rel="icon" href="/icons/plane.svg" type="image/svg+xml">
<link rel="icon" href="/icons/plane-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/plane-180.png">
</head>
<body data-auth="loading">
<main class="wrap">
  <a class="back" href="/">Puneeth &amp; Alaina</a>
  <h1>Monterrey New Year</h1>
  <p class="when">Dec 31 – Jan 3</p>
  <div data-show="loading"><p class="say">Loading…</p></div>
  <div data-show="out">
    <p class="say">Just for Puneeth and Alaina. Sign in with the Google account you use for the grocery list.</p>
    <button class="btn primary js-signin" type="button">Sign in with Google</button>
  </div>
  <div data-show="denied">
    <p class="say"><span class="who"></span> doesn’t have access to this page.</p>
    <button class="btn js-signout" type="button">Use a different account</button>
  </div>
  <div data-show="in"><p class="say" id="lockmsg" role="status">Opening…</p></div>
</main>
<script type="module">
import { bootLocked } from '/shared/locked.js';
bootLocked();
</script>
</body>
</html>
